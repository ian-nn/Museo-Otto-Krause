<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario - Museo Otto Krause</title>
    <link rel="stylesheet" href="css/panel-lautirichi-frontenddashboard.css" />
    <style>
      :root {
        --red: #C8001A;
        --color-brand-accent-hover: #C8001A;
      }

      .btn-sm {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: var(--font-family-heading);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .05em;
        text-transform: uppercase;
        padding: 7px 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: all .18s;
        line-height: 1;
      }

      .btn-sm svg {
        flex-shrink: 0;
      }

      .btn-primary {
        background: var(--red);
        color: white;
      }

      .btn-primary:hover {
        background: #a80016;
      }

      .btn-secondary {
        background: white;
        color: #4b5563;
        border: 1.5px solid #e5e5e5;
      }

      .btn-secondary:hover {
        border-color: #1f2937;
        color: #111111;
      }

      .inv-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}

      .topbar {
        margin-bottom: 18px;
      }

      .topbar-title-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        width: 100%;
      }

      .inv-actions {
        display: flex;
        justify-content: flex-end;
        width: auto;
        margin-left: auto;
        margin-bottom: 0;
      }

      .inv-actions-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .inv-search{flex:1;min-width:200px;border:1.5px solid var(--gray-200);border-radius:8px;padding:9px 14px;font-size:13px;font-family:inherit;outline:none;background:white}

      .inv-filter-select{border:1.5px solid var(--gray-200);border-radius:8px;padding:9px 14px;font-size:13px;font-family:inherit;background:white;cursor:pointer;outline:none}

      .inv-view-toggle {
        display: flex;
        gap: 4px;
        background: white;
        border-radius: 10px;
        padding: 4px;
        border: 1px solid #e5e5e5;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }

      .inv-view-btn {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #4b5563;
        transition: all .18s;
        background: transparent;
        border: none;
      }

      .inv-view-btn:hover {
        background: rgba(200, 0, 26, 0.06);
        color: #0d0d0d;
      }

      .inv-view-btn.active {
        background: var(--red);
        color: white;
      }

      .inv-count{font-size:12px;color:var(--gray-700);margin-bottom:10px}

      .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}

      .inv-card{border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--gray-200);background:var(--red);cursor:pointer;display:flex;flex-direction:column;transition:all .18s}

      .inv-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:rgba(200,0,26,.6)}

      .inv-card-img {
        height: 150px;
        flex-shrink: 0;
        background: linear-gradient(135deg, #f0e8e8, #e0d0d0);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .inv-card-initials {
        font-family: var(--font-family-heading);
        font-size: 48px;
        font-weight: 900;
        color: rgba(200, 0, 26, 0.15);
        text-transform: uppercase;
        letter-spacing: -2px;
      }

      .inv-card-code-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 4px;
        letter-spacing: 0.05em;
        font-family: var(--font-family-heading);
      }

      .inv-card-estado-dot {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        border: 2px solid white;
      }

      .inv-card-bottom {
        background: var(--color-brand-accent-hover);
        padding: 14px 16px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .inv-card-name {
        font-family: var(--font-family-heading);
        font-size: 16px;
        font-weight: 800;
        color: white;
        margin-bottom: 4px;
        line-height: 1.15;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .inv-card-sub {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.75);
        margin-bottom: 10px;
        line-height: 1.45;
        min-height: 2.9em;
        overflow: hidden;
      }

      .inv-card-chips {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-top: auto;
      }

      .inv-chip {
        font-size: 10px;
        font-weight: 700;
        color: white;
        padding: 2px 7px;
        border-radius: 3px;
        letter-spacing: 0.04em;
      }

      .inv-list {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }

      .inv-list-head,
      .inv-list-row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr 80px;
        gap: 0;
        padding: 12px 16px;
      }

      .inv-list-head {
        background: #f5f5f5;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #4b5563;
        border-bottom: 2px solid #e5e5e5;
      }

      .inv-list-row {
        border-bottom: 1px solid #e5e5e5;
        font-size: 13px;
        align-items: center;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .inv-list-row:hover {
        background: rgba(200, 0, 26, 0.03);
      }

      .inv-list-row:last-child {
        border-bottom: none;
      }

      .obj-section-title {
        font-family: var(--font-family-heading);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--red);
        margin: 18px 0 14px;
        border-bottom: 2px solid #F8E0E3;
        padding-bottom: 6px;
      }

      .obj-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px 16px;
        margin-bottom: 12px;
      }

      .obj-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .obj-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #4B5563;
      }

      .obj-label span {
        color: var(--red);
      }

      .obj-input,
      .obj-select {
        border: 1px solid #d1d5db;
        border-radius: 4px;
        padding: 10px 12px;
        font-size: 13px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.18s ease;
        background: #f8f8f8;
        color: #111827;
        min-height: 38px;
      }

      .obj-input:focus,
      .obj-select:focus {
        border-color: var(--red);
        background: white;
      }

      .obj-input.err,
      .obj-select.err {
        border-color: var(--red);
        background: rgba(200, 0, 26, 0.03);
      }

      .obj-err-msg {
        font-size: 11px;
        color: var(--red);
        margin-top: 2px;
      }

      .obj-upload-box {
        width: 100%;
        min-height: 120px;
        border: 3px solid #d7d7d7;
        border-radius: 8px;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #111827;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 12px;
        overflow: hidden;
      }

      .obj-upload-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 6px;
      }

      .obj-upload-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #F5F5F5;
        border: 1px solid #d1d5db;
        color: #111827;
        font-family: var(--font-family-heading);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
      }

      .obj-upload-btn:hover {
        border-color: #0D0D0D;
        background: #f0f0f0;
        color: #0D0D0D;
      }

      .obj-upload-hint {
        font-size: 12px;
        color: #6b7280;
        margin-top: 8px;
      }

      .inv-list-name {
        font-weight: 700;
        color: #0d0d0d;
      }

      .inv-list-sub {
        font-size: 11px;
        color: #4b5563;
        margin-top: 1px;
      }

      .pag {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 20px;
      }

      .pag-btn {
        width: 34px;
        height: 34px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: 1.5px solid #e5e5e5;
        background: white;
        color: #4b5563;
        transition: all 0.18s ease;
      }

      .pag-btn:hover:not(:disabled) {
        border-color: var(--color-brand-accent-hover);
        color: var(--color-brand-accent-hover);
      }

      .pag-btn.active {
        background: var(--color-brand-accent-hover);
        color: white;
        border-color: var(--color-brand-accent-hover);
      }

      .pag-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 64px;
        height: 24px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .badge-green {
        background: #dcfce7;
        color: #166534;
      }

      .badge-yellow {
        background: #fef3c7;
        color: #92400e;
      }

      .badge-red {
        background: #fee2e2;
        color: #991b1b;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        backdrop-filter: blur(3px);
        overflow: hidden;
      }

      #delete-confirm-overlay {
        z-index: 300;
      }

      .modal {
        background: white;
        border-radius: 20px;
        padding: 32px;
        width: 100%;
        max-width: 660px;
        max-height: 90vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      .modal-hdr {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }

      .modal-title {
        font-family: var(--font-family-heading);
        font-size: 22px;
        font-weight: 900;
        text-transform: uppercase;
        color: #0d0d0d;
      }

      .modal-close {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 20px;
        color: #4b5563;
        flex-shrink: 0;
      }

      .modal-close:hover {
        background: #e5e5e5;
      }

      .modal-chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .modal-scroll-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding-right: 2px;
      }

      #inv-modal-image {
        flex: 0 0 auto;
        width: 100%;
        min-height: 80px;
        max-height: 280px;
        overflow: hidden;
        margin-bottom: 18px;
      }

      #inv-modal-image img {
        display: block;
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 12px;
      }

      .modal > form {
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .modal-section {
        background: #f5f5f5;
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 14px;
      }

      .modal-section-title {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--color-brand-accent-hover);
        margin-bottom: 12px;
      }

      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        min-width: 0;
      }

      .modal-grid > div {
        min-width: 0;
      }

      .modal-field-label,
      .modal-field-val {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .modal-field-label {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-brand-accent-hover);
      }

      .modal-field-val {
        font-size: 14px;
        font-weight: 700;
        color: #0d0d0d;
        margin-top: 2px;
      }

      .modal-desc {
        font-size: 14px;
        color: #4b5563;
        line-height: 1.7;
        background: #f5f5f5;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }



      .modal-actions {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #e5e5e5;
        flex-shrink: 0;
        background: white;
      }

      .modal-actions .btn-sm {
        flex: 1;
        min-height: unset;
        height: auto;
        font-family: var(--font-family-heading);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .05em;
        text-transform: uppercase;
        padding: 7px 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: all .18s;
        border: none;
        text-align: center;
      }

      .modal-actions .btn-sm.btn-close {
        background: white;
        color: #4b5563;
        border: 1.5px solid #d1d5db;
      }

      .modal-actions .btn-sm.btn-close:hover {
        border-color: #1f2937;
        background: #f5f5f5;
        color: #111111;
      }

      .modal-actions .btn-sm.btn-edit {
        background: #1f1f1f;
        color: white;
      }

      .modal-actions .btn-sm.btn-edit:hover {
        background: #0d0d0d;
      }

      .modal-actions .btn-sm.btn-delete {
        background: var(--red);
        color: white;
      }

      .modal-actions .btn-sm.btn-delete:hover {
        background: #a80016;
      }

      .delete-confirm-modal {
        max-width: 440px;
        text-align: center;
      }

      .delete-confirm-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(200, 0, 26, .1);
        color: var(--red);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 4px auto 16px;
      }

      .delete-confirm-title {
        font-family: var(--font-family-heading);
        font-size: 1.35rem;
        font-weight: 900;
        color: var(--black);
        margin-bottom: 8px;
      }

      .delete-confirm-text {
        color: #6b7280;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .delete-confirm-actions {
        display: flex;
        gap: 10px;
      }

      .delete-confirm-actions .btn-sm {
        flex: 1;
      }

      .cat-modal-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        margin-top: 16px;
      }

      .cat-modal-table thead {
        background: #f5f5f5;
        border-bottom: 2px solid #e5e5e5;
      }

      .cat-modal-table th {
        font-family: var(--font-family-heading);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-brand-accent-hover);
        padding: 12px 16px;
        text-align: left;
      }

      .cat-modal-table td {
        padding: 14px 16px;
        border-bottom: 1px solid #e5e5e5;
      }

      .cat-modal-table tbody tr:hover {
        background: #f9f9f9;
      }

      .cat-modal-table .cat-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .cat-action-btn {
        width: 32px;
        height: 32px;
        border-radius: 4px;
        border: 1px solid #e5e5e5;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #4b5563;
        transition: all 0.18s ease;
      }

      .cat-action-btn:hover {
        background: #e5e5e5;
        border-color: #d1d5db;
      }

      .cat-action-btn.delete:hover {
        background: #fee2e2;
        color: var(--red);
        border-color: var(--red);
      }

      .hidden {
        display: none;
      }

      .inv-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      @media (max-width: 980px) {
        .inv-list-head,
        .inv-list-row {
          grid-template-columns: 2fr 1fr 1fr 1fr;
        }
        .inv-list-head > div:nth-child(5),
        .inv-list-row > div:nth-child(5),
        .inv-list-head > div:nth-child(6),
        .inv-list-row > div:nth-child(6) {
          display: none;
        }
      }

      @media (max-width: 720px) {
        .inv-toolbar { flex-direction: column; }
        .inv-view-toggle { width: 100%; justify-content: flex-start; }

        .modal-overlay {
          padding: 10px;
        }

        .modal {
          max-height: calc(100vh - 20px);
          padding: 22px 18px;
          border-radius: 14px;
        }

        .modal-grid {
          grid-template-columns: 1fr;
        }

        .modal-actions {
          flex-direction: column;
        }

        .modal-actions .btn-sm {
          width: 100%;
        }
      }

      /* TOAST */
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 999;
        background: #000000;
        color: white;
        padding: 14px 20px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 8px 32px rgba(0, 0, 0, .3);
        display: flex;
        align-items: center;
        gap: 10px;
        animation: toastIn .3s ease;
        border-left: 4px solid var(--red);
      }

      #toast-container {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1000;
        pointer-events: none;
      }

      @keyframes toastIn {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .toast-icon {
        width: 20px;
        height: 20px;
        background: var(--red);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var navItems = document.querySelectorAll('.sidebar-nav .nav-item');
        navItems.forEach(function(item) {
          var href = item.getAttribute('href');
          if (href === window.location.pathname.split('/').pop()) {
            item.classList.add('active');
          }
        });
      });
    </script>
  </head>
  <body class="dashboard-page">
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="brand-block">
            <div class="brand-mark">MK</div>
            <div>
              <h2>Museo Otto Krause</h2>
              <p>Administración</p>
            </div>
          </div>

          <div class="nav-group">
            <div class="group-title">Gestión</div>
            <nav class="sidebar-nav">

        { id: 'INV-007', nombre: 'Máquina de escribir', codigo: 'MW-1945', categoria: 'Oficina', sala: 'Sala 2', estado: 'Bueno', coleccion: 'Educativa', autor: 'Remington', epoca: '1945', dimensiones: '40 x 35 x 15 cm', material: 'Metal / plástico', propiedad: 'Donado', donante: 'Archivo escolar', vitrina: 'Vitrina 3', cajon: 'Cajón 3', descripcion: 'Máquina de escribir mecánica utilizada por los estudiantes.', codigoAntiguo: 'O-049', codigoSigaf: 'SIG-607', codigoFisico: 'FIS-007' },
        { id: 'INV-008', nombre: 'Generador de corriente', codigo: 'GEN-1955', categoria: 'Electrónica', sala: 'Sala 1', estado: 'Bueno', coleccion: 'Industrial', autor: 'Siemens', epoca: '1950s', dimensiones: '170 x 90 x 120 cm', material: 'Metal / cobre / vidrio', propiedad: 'Propio', donante: '—', vitrina: 'Piso', cajon: '—', descripcion: 'Generador histórico usado en experimentos eléctricos.', codigoAntiguo: 'E-221', codigoSigaf: 'SIG-703', codigoFisico: 'FIS-008' }
      ];

      const STATE = {
        view: 'grid',
        query: '',
        sala: '',
        categoria: '',
        coleccion: '',
        page: 1,
        perPageGrid: 10,
        perPageList: 10,
        currentItem: null,
        toast: null,
        toastTimer: null
      };

      const invSearch = document.getElementById('inv-search');
      const invSala = document.getElementById('inv-sala');
      const invCat = document.getElementById('inv-cat');
      const invCol = document.getElementById('inv-col');
      const invContent = document.getElementById('inv-content');
      const invCount = document.getElementById('inv-count');
      const invPag = document.getElementById('inv-pag');
      const invViewButtons = document.querySelectorAll('.inv-view-btn');
      const invModalOverlay = document.getElementById('inv-modal-overlay');
      const invModalTitle = document.getElementById('inv-modal-title');
      const invModalChips = document.getElementById('inv-modal-chips');
      const invModalImage = document.getElementById('inv-modal-image');
      const invModalIdentidad = document.getElementById('inv-modal-identidad');
      const invModalFicha = document.getElementById('inv-modal-ficha');
      const invModalDesc = document.getElementById('inv-modal-desc');
      const invModalClose = document.getElementById('inv-modal-close');
      const invModalClose2 = document.getElementById('inv-modal-close-2');
      const invModalEdit = document.getElementById('inv-modal-edit');
      const deleteConfirmOverlay = document.getElementById('delete-confirm-overlay');
      const deleteConfirmTitle = document.getElementById('delete-confirm-title');
      const deleteConfirmText = document.getElementById('delete-confirm-text');
      const deleteConfirmCancel = document.getElementById('delete-confirm-cancel');
      const deleteConfirmAccept = document.getElementById('delete-confirm-accept');
      const btnAdd = document.getElementById('btn-add');
      const btnImport = document.getElementById('btn-import');
      const btnCategories = document.getElementById('btn-categories');

      let pendingDeleteAction = null;

      function openDeleteConfirm(title, message, action) {
        pendingDeleteAction = action;
        deleteConfirmTitle.textContent = title;
        deleteConfirmText.innerHTML = message;
        deleteConfirmOverlay.classList.remove('hidden');
        deleteConfirmOverlay.setAttribute('aria-hidden', 'false');
      }

      function closeDeleteConfirm() {
        pendingDeleteAction = null;
        deleteConfirmOverlay.classList.add('hidden');
        deleteConfirmOverlay.setAttribute('aria-hidden', 'true');
      }

      function normalize(text) {
        return String(text || '').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');
      }

      function uniqueValues(field) {
        return [...new Set(INVENTARIO_DATA.map(item => item[field]).filter(Boolean))].sort();
      }

      function nextObjectId() {
        const highestId = INVENTARIO_DATA.reduce((highest, item) => {
          const numericId = Number(String(item.id || '').replace(/^INV-/, ''));
          return Number.isFinite(numericId) ? Math.max(highest, numericId) : highest;
        }, 0);
        return `INV-${String(highestId + 1).padStart(3, '0')}`;
      }

      function hasDuplicateCode(code, excludedId = '') {
        const normalizedCode = normalize(code);
        return INVENTARIO_DATA.some(item => item.id !== excludedId && normalize(item.codigo) === normalizedCode);
      }

      function estadoColor(estado) {
        if (estado === 'Bueno') return '#16a34a';
        if (estado === 'Regular') return '#d97706';
        return '#b91c1c';
      }

      function chipColor(text) {
        const key = normalize(text || '');
        if (key.includes('electr')) return '#9333ea';
        if (key.includes('mec')) return '#2563eb';
        if (key.includes('instr')) return '#0f766e';
        if (key.includes('jugu')) return '#db2777';
        return '#374151';
      }

      function populateSelects() {
        const salaOptions = uniqueValues('sala');
        const catOptions = uniqueValues('categoria');
        const colOptions = uniqueValues('coleccion');

        invSala.innerHTML = `<option value="">Todas las salas</option>${salaOptions.map(value => `<option value="${value}">${value}</option>`).join('')}`;
        invCat.innerHTML = `<option value="">Todas las categorías</option>${catOptions.map(value => `<option value="${value}">${value}</option>`).join('')}`;
        invCol.innerHTML = `<option value="">Todas las colecciones</option>${colOptions.map(value => `<option value="${value}">${value}</option>`).join('')}`;
        invSala.value = salaOptions.includes(STATE.sala) ? STATE.sala : '';
        invCat.value = catOptions.includes(STATE.categoria) ? STATE.categoria : '';
        invCol.value = colOptions.includes(STATE.coleccion) ? STATE.coleccion : '';
      }

      function getFilteredItems() {
        const query = normalize(STATE.query);
        return INVENTARIO_DATA.filter(item => {
          if (STATE.sala && item.sala !== STATE.sala) return false;
          if (STATE.categoria && item.categoria !== STATE.categoria) return false;
          if (STATE.coleccion && item.coleccion !== STATE.coleccion) return false;
          if (query) {
            const values = [item.nombre, item.codigo, item.categoria, item.coleccion, item.sala, item.vitrina, item.autor, item.epoca, item.descripcion, item.codigoAntiguo, item.codigoSigaf];
            return values.some(value => normalize(value).includes(query));
          }
          return true;
        });
      }

      function renderPag(totalPages) {
        if (totalPages <= 1) {
          invPag.innerHTML = '';
          return;
        }

        const buttons = [];
        buttons.push(`<button class="pag-btn" data-page="${STATE.page - 1}" ${STATE.page === 1 ? 'disabled' : ''}>‹</button>`);

        for (let i = 1; i <= totalPages; i++) {
          if (totalPages > 7 && i > 2 && i < totalPages - 1 && Math.abs(i - STATE.page) > 1) {
            if (i === 3 || i === totalPages - 2) buttons.push('<span style="padding:0 4px;color:#4b5563">…</span>');
            continue;
          }
          buttons.push(`<button class="pag-btn ${i === STATE.page ? 'active' : ''}" data-page="${i}">${i}</button>`);
        }

        buttons.push(`<button class="pag-btn" data-page="${STATE.page + 1}" ${STATE.page === totalPages ? 'disabled' : ''}>›</button>`);
        invPag.innerHTML = `<div class="pag">${buttons.join('')}</div>`;
      }

      function renderGrid(items) {
        return `<div class="inv-grid">${items.map(item => `
          <div class="inv-card" data-id="${escapeHtml(item.id)}">
            <div class="inv-card-img">
              ${item.imagen ? `<img src="${escapeHtml(item.imagen)}" alt="${escapeHtml(item.nombre)}"/>` : `<div class="inv-card-initials">${escapeHtml(item.nombre.split(' ').map(w => w[0]).join('').slice(0,3))}</div>`}
              <div class="inv-card-code-badge">${escapeHtml(item.codigo)}</div>
              <div class="inv-card-estado-dot" style="background:${estadoColor(item.estado)}"></div>
            </div>
            <div class="inv-card-bottom">
              <div class="inv-card-name">${escapeHtml(item.nombre)}</div>
              <div class="inv-card-sub">${escapeHtml(item.autor !== 'Desconocido' ? item.autor : item.categoria)}<br>${escapeHtml(item.epoca || item.sala + ' · ' + item.vitrina)}</div>
              <div class="inv-card-chips">
                <span class="inv-chip" style="background:${chipColor(item.categoria)}">${escapeHtml(item.categoria)}</span>
                <span class="inv-chip" style="background:${chipColor(item.coleccion)}">${escapeHtml(item.coleccion)}</span>
                <span class="inv-chip" style="background:${item.propiedad === 'Donado' ? '#6b7280' : '#374151'}">${item.propiedad === 'Donado' ? 'DON' : 'PRO'}</span>
              </div>
            </div>
          </div>
        `).join('')}</div>`;
      }

      function renderList(items) {
        return `
          <div class="inv-list">
            <div class="inv-list-head"><div>Nombre</div><div>Categoría</div><div>Sala</div><div>Estado</div><div>Colección</div><div>·</div></div>
            ${items.map(item => `
              <div class="inv-list-row" data-id="${escapeHtml(item.id)}">
                <div>
                  <div class="inv-list-name">${escapeHtml(item.nombre)}</div>
                  <div class="inv-list-sub">${escapeHtml(item.codigo)}</div>
                </div>
                <div>${escapeHtml(item.categoria)}</div>
                <div>${escapeHtml(item.sala)}</div>
                <div>${escapeHtml(item.estado)}</div>
                <div>${escapeHtml(item.coleccion)}</div>
                <div><span class="badge ${item.estado === 'Bueno' ? 'badge-green' : item.estado === 'Regular' ? 'badge-yellow' : 'badge-red'}">${escapeHtml(item.estado)}</span></div>
              </div>
            `).join('')}
          </div>`;
      }

      function renderInventory() {
        const filtered = getFilteredItems();
        const perPage = STATE.view === 'grid' ? STATE.perPageGrid : STATE.perPageList;
        const totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
        STATE.page = Math.min(STATE.page, totalPages);
        const start = (STATE.page - 1) * perPage;
        const pageItems = filtered.slice(start, start + perPage);

        invCount.textContent = `Mostrando ${pageItems.length} de ${filtered.length} objetos (página ${STATE.page} de ${totalPages})`;
        invContent.innerHTML = pageItems.length ? (STATE.view === 'grid' ? renderGrid(pageItems) : renderList(pageItems)) : '<div style="padding:24px;color:#4b5563;text-align:center">Sin resultados</div>';
        renderPag(totalPages);
      }

      function openModal(itemId) {
        const item = INVENTARIO_DATA.find(i => i.id === itemId);
        if (!item) return;
        STATE.currentItem = item;
        invModalTitle.textContent = item.nombre;
        invModalChips.innerHTML = `
          <span class="inv-chip" style="background:${chipColor(item.categoria)}">${item.categoria}</span>
          <span class="inv-chip" style="background:${chipColor(item.coleccion)}">${item.coleccion}</span>
          <span class="inv-chip" style="background:${estadoColor(item.estado)}">${item.estado}</span>`;

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        })[char]);
      }

      function parseCsvLine(line) {
        const values = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            values.push(current.trim());
            current = '';
          } else {
            current += char;
          }
        }

        values.push(current.trim());
        return values;
      }

      function buildImportTemplate() {
        const headers = [
          'nombre',
          'codigo',
          'categoria',
          'coleccion',
          'sala',
          'estado',
          'autor',
          'epoca',
          'material',
          'dimensiones',
          'propiedad',
          'donante',
          'vitrina',
          'cajon',
          'descripcion',
          'codigoAntiguo',
          'codigoSigaf',
          'codigoFisico'
        ];
        return [headers.join(','), 'Tablero eléctrico,TAB-1930,Electrónica,Industrial,Sala 1,Bueno,Desconocido,Década de 1930,Metal / madera / vidrio,80 x 120 x 20 cm,Donado,Fundación Otto Krause,Vitrina 4,Cajón 4,Tablero eléctrico histórico utilizado en la antigua planta de máquinas.,T-001,SIG-101,FIS-001'].join('\n');
      }

      function downloadImportTemplate() {
        const blob = new Blob([buildImportTemplate()], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = 'plantilla-inventario.csv';
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      }

      function makeItemFromRow(row) {
        const values = row || {};
        const nombre = values.nombre || values.Nombre || values.NOMBRE || '';
        const codigo = values.codigo || values.Codigo || values.CÓDIGO || values['Código'] || '';

        if (!nombre || !codigo) {
          return null;
        }

        const categoryName = values.categoria || values.Categoria || values.CATEGORIA || 'Sin categoría';
        const collectionName = values.coleccion || values.Coleccion || values.COLECCION || 'Sin colección';
        const salaName = values.sala || values.Sala || values.SALA || 'Sin sala';
        const statusName = values.estado || values.Estado || values.ESTADO || 'Bueno';
        const ownerName = values.propiedad || values.Propiedad || values.PROPIEDAD || 'Propio';

        return {
          id: '',
          nombre: nombre.trim(),
          codigo: codigo.trim(),
          categoria: categoryName.trim(),
          coleccion: collectionName.trim(),
          sala: salaName.trim(),
          estado: statusName.trim(),
          autor: (values.autor || values.Autor || 'Desconocido').trim(),
          epoca: (values.epoca || values.Epoca || values['Época'] || '').trim(),
          material: (values.material || values.Material || '').trim(),

          vitrina: (values.vitrina || values.Vitrina || '').trim() || 'Sin vitrina',
          cajon: (values.cajon || values.Cajon || values['Cajón'] || '').trim(),
          descripcion: (values.descripcion || values.Descripcion || '').trim(),

      function openImportModal() {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
          <div class="modal" role="dialog" aria-modal="true" aria-labelledby="import-modal-title" style="max-width:540px">
            <div class="modal-hdr">
              <div>
                <h2 class="modal-title" id="import-modal-title">Importar planilla</h2>
              </div>
              <button class="modal-close" type="button" data-close-import>×</button>
            </div>
            <div style="display:grid;gap:16px; margin-top:8px">
              <div style="padding:16px;border:1px solid #e5e7eb;border-radius:12px;background:#f9fafb;line-height:1.5;font-size:14px;color:#374151">
                Descargá la plantilla CSV, completá los datos y volvé a subirla para agregar objetos al inventario.
              </div>
              <div style="display:flex;gap:10px;flex-wrap:wrap">
                <button class="btn-sm btn-secondary" type="button" id="download-template-btn">Descargar plantilla</button>
                <button class="btn-sm btn-primary" type="button" id="trigger-file-import">Seleccionar archivo</button>
              </div>
              <input id="csv-file-input" type="file" accept=".csv,text/csv" hidden />
              <div id="import-status" style="font-size:13px;color:#4b5563;min-height:20px"></div>
            </div>
          </div>
        `;

        document.body.appendChild(overlay);

        const close = () => overlay.remove();
        overlay.addEventListener('click', event => {
          if (event.target === overlay) close();
        });
        overlay.querySelector('[data-close-import]').addEventListener('click', close);

        overlay.querySelector('#download-template-btn').addEventListener('click', () => {
          downloadImportTemplate();
        });

        overlay.querySelector('#trigger-file-import').addEventListener('click', () => {
          overlay.querySelector('#csv-file-input').click();
        });

        overlay.querySelector('#csv-file-input').addEventListener('change', function(event) {
          const file = event.target.files && event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function() {
            try {
              const text = String(reader.result || '');
              const lines = text.split(/\r?\n/).filter(line => line.trim().length);
              if (lines.length < 2) {
                throw new Error('El archivo CSV está vacío o no tiene filas de datos.');
              }

              const header = parseCsvLine(lines[0]).map(value => value.toLowerCase().replace(/\s+/g, ''));
              const rows = lines.slice(1).map(line => parseCsvLine(line));
              const imported = [];

              rows.forEach((values) => {
                if (values.length === 0 || values.every(value => value === '')) return;

                const rowObject = {};
                header.forEach((key, index) => {
                  rowObject[key] = values[index] || '';
                });
                const item = makeItemFromRow(rowObject);
                if (item) {
                  imported.push(item);
                }
              });

              if (!imported.length) {
                throw new Error('No se pudo importar ninguna fila válida. Revisá los nombres de columnas y campos.');
              }

              imported.forEach(item => {
                const existingIndex = INVENTARIO_DATA.findIndex(existing => existing.codigo === item.codigo);
                if (existingIndex >= 0) {
                  INVENTARIO_DATA[existingIndex] = { ...INVENTARIO_DATA[existingIndex], ...item };
                } else {
                  item.id = nextObjectId();
                  INVENTARIO_DATA.push(item);
                }
              });

              showToast(`${imported.length} objeto${imported.length !== 1 ? 's' : ''} importado${imported.length !== 1 ? 's' : ''}`);
              populateSelects();
              renderInventory();
              overlay.querySelector('#import-status').textContent = `Se importaron ${imported.length} objetos correctamente.`;
              setTimeout(close, 700);
            } catch (error) {
              overlay.querySelector('#import-status').textContent = error.message;
              overlay.querySelector('#import-status').style.color = '#b91c1c';
            }
          };

          reader.readAsText(file);
        });
      }

            const value = overlay.querySelector('#category-new-name').value.trim();
            if (!value) {
              alert('Ingresá un nombre para la categoría.');
              return;
            }

            const exists = uniqueValues('categoria').some(category => normalize(category) === normalize(value));
            if (exists) {
              alert('Esa categoría ya existe.');
              return;
            }

            INVENTARIO_DATA.forEach(item => {
              if (!item.categoria) item.categoria = value;
            });
            INVENTARIO_DATA.push({
              id: nextObjectId(),
              nombre: `Categoría ${value}`,
              codigo: `CAT-${Date.now()}`,
              categoria: value,
              coleccion: 'Sin colección',
              sala: 'Sin sala',

            renderInventory();
            refreshModal();
          });

          overlay.querySelectorAll('[data-category-action]').forEach(button => {
            button.addEventListener('click', () => {
              const action = button.dataset.categoryAction;
              const name = button.dataset.categoryName;

              if (action === 'rename') {
                const nextValue = prompt('Ingresá el nuevo nombre de la categoría:', name);
                if (nextValue === null) return;
                const cleaned = nextValue.trim();
                if (!cleaned) {
                  alert('El nombre no puede estar vacío.');
                  return;
                }
                if (uniqueValues('categoria').some(category => category !== name && normalize(category) === normalize(cleaned))) {
                  alert('Ya existe otra categoría con ese nombre.');
                  return;
                }

                INVENTARIO_DATA.forEach(item => {
                  if (item.categoria === name) item.categoria = cleaned;
                });
                populateSelects();
                renderInventory();
                refreshModal();
              }

              if (action === 'delete') {
                const itemsUsing = INVENTARIO_DATA.filter(item => item.categoria === name).length;
                const detail = itemsUsing > 0
                  ? `Hay <strong style="color:var(--red)">${itemsUsing} objeto${itemsUsing !== 1 ? 's' : ''}</strong> usando esta categoría. Quedarán sin categoría asignada.`

                openDeleteConfirm(
                  `¿Eliminar "${escapeHtml(name)}"?`,
                  `${detail}<br><span style="font-size:13px">Esta acción no se puede deshacer.</span>`,
                  () => {
                    INVENTARIO_DATA.forEach(item => {
                      if (item.categoria === name) item.categoria = '';
                    });

                    const categoryIndex = INVENTARIO_DATA.findIndex(item => item.nombre === `Categoría ${name}` && item.codigo.startsWith('CAT-'));
                    if (categoryIndex >= 0) {
                      INVENTARIO_DATA.splice(categoryIndex, 1);
                    }

                    populateSelects();
                    renderInventory();
                    refreshModal();
                  }
                );
              }
            });
          });
        };

        document.body.appendChild(overlay);
        overlay.addEventListener('click', function(event) {
          if (event.target === overlay) overlay.remove();
        });
        refreshModal();
      }

                <div class="obj-field">
                  <label class="obj-label">Material principal</label>
                  <input name="material" type="text" class="obj-input" value="${escapeHtml(editingItem.material || '')}" />
                </div>
                <div class="obj-field">
                  <label class="obj-label">Estado</label>
                  <select name="estado" class="obj-select" style="width:100%">
                    ${['Bueno', 'Regular', 'Malo'].map(value => `<option value="${value}" ${value === editingItem.estado ? 'selected' : ''}>${value}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div class="obj-section-title">Ubicación</div>
              <div class="obj-row">
                <div class="obj-field">
                  <label class="obj-label">Sala / Piso</label>
                  <select name="sala" class="obj-select" style="width:100%">${salaOptions || '<option value="Sin sala">Sin sala</option>'}</select>
                </div>
                <div class="obj-field">
                  <label class="obj-label">Vitrina / ubicación</label>
                  <input name="vitrina" type="text" class="obj-input" value="${escapeHtml(editingItem.vitrina || '')}" />
                </div>
              </div>

              <div class="obj-section-title">Propiedad</div>
              <div class="obj-row">
                <div class="obj-field">
                  <label class="obj-label">Propietario</label>
                  <select name="propiedad" class="obj-select" style="width:100%">
                    ${['Propio', 'Donado'].map(value => `<option value="${value}" ${value === editingItem.propiedad ? 'selected' : ''}>${value}</option>`).join('')}
                  </select>
                </div>
                <div class="obj-field">
                  <label class="obj-label">Donador</label>
                  <input name="donante" type="text" class="obj-input" value="${escapeHtml(editingItem.donante || '')}" />
                </div>
              </div>
              <div class="obj-row">
                <div class="obj-field">
                  <label class="obj-label">Cajón</label>
                  <input name="cajon" type="text" class="obj-input" value="${escapeHtml(editingItem.cajon || '')}" />
                </div>
                <div class="obj-field"></div>
              </div>

              <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
                <button class="btn-sm btn-secondary" type="button" data-close-edit>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                  Cancelar
                </button>
                <button class="btn-sm btn-primary" type="submit">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                  Guardar cambios
                </button>
              </div>
            </form>
          </div>
        `;

        document.body.appendChild(overlay);
        const close = () => overlay.remove();
        overlay.addEventListener('click', function(event) {
          if (event.target === overlay) close();
        });
        const closeButtons = overlay.querySelectorAll('[data-close-edit]');
        closeButtons.forEach(btn => btn.addEventListener('click', close));

        overlay.querySelector('#edit-img-input').addEventListener('change', function(event) {
          const file = event.target.files && event.target.files[0];
          if (!file) return;

          if (!file.type.startsWith('image/')) {
            alert('Seleccioná un archivo de imagen válido.');
            event.target.value = '';
            return;
          }

          if (file.size > 5 * 1024 * 1024) {
            alert('La imagen no puede superar los 5 MB.');
            event.target.value = '';
            return;
          }

          imageReadPending = true;
          const reader = new FileReader();
          reader.onload = function() {
            selectedImage = String(reader.result || '');
            imageReadPending = false;
            overlay.querySelector('#edit-img-preview').innerHTML = `<img src="${escapeHtml(selectedImage)}" alt="Vista previa"/>`;
          };
          reader.onerror = function() {
            imageReadPending = false;
            event.target.value = '';
            alert('No se pudo leer la imagen seleccionada.');
          };
          reader.readAsDataURL(file);
        });

        overlay.querySelector('#object-edit-form').addEventListener('submit', function(event) {
          event.preventDefault();
          const formData = new FormData(this);
          const nextItem = {
            nombre: String(formData.get('nombre') || '').trim(),
            codigo: String(formData.get('codigo') || '').trim(),
            categoria: String(formData.get('categoria') || '').trim() || 'Sin categoría',
            coleccion: String(formData.get('coleccion') || '').trim() || 'Sin colección',
            sala: String(formData.get('sala') || '').trim() || 'Sin sala',
            vitrina: String(formData.get('vitrina') || '').trim() || 'Sin vitrina',
            cajon: String(formData.get('cajon') || '').trim(),
            estado: String(formData.get('estado') || '').trim() || 'Bueno',
            autor: String(formData.get('autor') || '').trim() || 'Desconocido',
            epoca: String(formData.get('epoca') || '').trim(),
            material: String(formData.get('material') || '').trim(),
            dimensiones: String(formData.get('dimensiones') || '').trim(),
            propiedad: String(formData.get('propiedad') || '').trim() || 'Propio',
            donante: String(formData.get('donante') || '').trim(),
            descripcion: String(formData.get('descripcion') || '').trim(),
            codigoAntiguo: String(formData.get('codigoAntiguo') || '').trim(),
            codigoSigaf: String(formData.get('codigoSigaf') || '').trim(),
            codigoFisico: String(formData.get('codigoFisico') || '').trim(),
            imagen: selectedImage
          };

          if (imageReadPending) {
            alert('Esperá a que termine de cargarse la imagen.');
            return;
          }

          if (!nextItem.nombre || !nextItem.codigo) {
            alert('El nombre y el código son obligatorios.');
            return;
          }

          if (hasDuplicateCode(nextItem.codigo, isNew ? '' : itemId)) {
            alert('Ya existe un objeto con ese código. Ingresá un código único.');
            return;
          }

          if (isNew) {
            const newItem = {
              id: nextObjectId(),
              ...nextItem
            };
            INVENTARIO_DATA.push(newItem);
            showToast(`"${newItem.nombre}" agregado al inventario`);
          } else {
            const targetIndex = INVENTARIO_DATA.findIndex(entry => entry.id === itemId);
            if (targetIndex >= 0) {
              INVENTARIO_DATA[targetIndex] = { ...INVENTARIO_DATA[targetIndex], ...nextItem };
              showToast(`"${nextItem.nombre}" actualizado correctamente`);
            }
          }

          populateSelects();
          renderInventory();
          close();
          if (STATE.currentItem) {
            openModal(STATE.currentItem.id);
          }
        });
      }

      function showToast(msg) {
        if (STATE.toastTimer) clearTimeout(STATE.toastTimer);
        STATE.toast = msg;
        renderToastEl();
        STATE.toastTimer = setTimeout(() => {
          STATE.toast = null;
          renderToastEl();
        }, 3500);
      }

      function renderToastEl() {
        let el = document.getElementById('toast-container');
        if (!el) {
          el = document.createElement('div');
          el.id = 'toast-container';
          document.body.appendChild(el);
        }
        el.innerHTML = STATE.toast
          ? `<div class="toast"><div class="toast-icon">${ico.check}</div>${escapeHtml(STATE.toast)}</div>`
          : '';
      }

      function initEvents() {
        invSearch.addEventListener('input', function() {
          STATE.query = this.value;
          STATE.page = 1;
          renderInventory();
        });

        invSala.addEventListener('change', function() {
          STATE.sala = this.value;
          STATE.page = 1;
          renderInventory();
        });

        invCat.addEventListener('change', function() {
          STATE.categoria = this.value;
          STATE.page = 1;
          renderInventory();
        });

        invCol.addEventListener('change', function() {
          STATE.coleccion = this.value;
          STATE.page = 1;
          renderInventory();
        });

        invViewButtons.forEach(button => {
          button.addEventListener('click', function() {
            STATE.view = this.dataset.view;
            invViewButtons.forEach(btn => btn.classList.toggle('active', btn === this));
            STATE.page = 1;
            renderInventory();
          });
        });

        invContent.addEventListener('click', function(event) {
          const card = event.target.closest('[data-id]');
          if (!card) return;
          openModal(card.dataset.id);
        });

        invPag.addEventListener('click', function(event) {
          const button = event.target.closest('.pag-btn');
          if (!button || button.disabled) return;
          STATE.page = Number(button.dataset.page);
          renderInventory();
        });

        invModalClose.addEventListener('click', closeModal);
        invModalClose2.addEventListener('click', closeModal);
        invModalOverlay.addEventListener('click', function(event) {
          if (event.target === invModalOverlay) closeModal();
        });

        invModalEdit.addEventListener('click', function() {
          const currentItemId = STATE.currentItem ? STATE.currentItem.id : null;
          if (!currentItemId) return;
          closeModal();
          openEditObjectModal(currentItemId, false);
        });

        const invModalDelete = document.getElementById('inv-modal-delete');
        invModalDelete.addEventListener('click', function() {
          if (!STATE.currentItem) return;
          const itemToDelete = STATE.currentItem;
          openDeleteConfirm(
            '¿Eliminar este objeto?',
            `Estás a punto de eliminar <strong style="color:var(--red)">"${escapeHtml(itemToDelete.nombre)}"</strong> (${escapeHtml(itemToDelete.codigo)}) del inventario.<br><span style="font-size:13px">Esta acción no se puede deshacer.</span>`,
            () => {
            const index = INVENTARIO_DATA.findIndex(i => i.id === itemToDelete.id);
            if (index >= 0) {
              const deletedName = INVENTARIO_DATA[index].nombre;
              INVENTARIO_DATA.splice(index, 1);
              closeModal();
              renderInventory();
              showToast(`"${deletedName}" eliminado del inventario`);
            }
            }
          );
        });

        deleteConfirmCancel.addEventListener('click', closeDeleteConfirm);
        deleteConfirmAccept.addEventListener('click', function() {
          const action = pendingDeleteAction;
          closeDeleteConfirm();
          if (action) action();
        });
        deleteConfirmOverlay.addEventListener('click', function(event) {
          if (event.target === deleteConfirmOverlay) closeDeleteConfirm();
        });

        btnAdd.addEventListener('click', function() {
          openEditObjectModal(null, true);
        });

        btnImport.addEventListener('click', function() {
          openImportModal();
        });

        btnCategories.addEventListener('click', function() {
          openCategoryManager();
        });
      }

      document.addEventListener('DOMContentLoaded', function() {
        populateSelects();
        initEvents();
        renderInventory();
      });
    </script>
  </body>
</html>
